<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Gradisy">
  <!-- Logo đầy đủ: vòng chuyển sắc + chữ GRADISY (phông Poppins Medium, giãn chữ rộng). Nền sáng. -->
  <defs>
    <linearGradient id="gfVong" x1="1" y1="0.3" x2="0.1" y2="0.92"><stop offset="0" stop-color="#111"/><stop offset="1" stop-color="#b0b0b0"/></linearGradient>
    <mask id="gfKhe"><rect width="300" height="180" fill="#fff"/><circle cx="174.2" cy="27" r="14.5" fill="#000"/></mask>
  </defs>
  <circle cx="150" cy="52" r="35" fill="none" stroke="url(#gfVong)" stroke-width="10" mask="url(#gfKhe)"/>
  <circle cx="174.2" cy="27" r="11" fill="#111"/>
  <text x="150" y="160" text-anchor="middle" font-family="Poppins, 'Be Vietnam Pro', Arial, sans-serif" font-weight="500" font-size="30" letter-spacing="11" fill="#111">GRADISY</text>
</svg>
